[package]
name = "omni-agent"
version = "0.1.0"
description = "Omni Agent Desktop Client - Native Backend"
authors = ["Omni Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }

[lib]
name = "omni_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
